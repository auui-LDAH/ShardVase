name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Build Tools 2022 x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify toolchain
        run: |
          cl
          python --version
          git --version

      # 本步用默认配置（Dev，无 D2b / 无 PROT_RELEASE_CONCEAL）。
      #   旧步骤名写作 "Build (Release)" 与实现不符，已改正。
      #   保留 Dev 的理由：门禁（下面的 Full release gate）会用 `-Config Release`
      #   构建**另一份**二进制并跑 e2e/attacks/vm_unit/vmc/example/protchain；
      #   若本步也改 Release，这些"独立步骤"就只是在重复门禁已做过的同配置检查，
      #   失去"Dev 配置也测一遍"的覆盖面。若确实想要 Release，加 `-Config Release`
      #   并同步 `docs/CI_PLAN.md` §2.1 与 `tools/ci_sim.ps1:61`。
      #
      # 缺陷 5c（2026-10-02）: 本步加 -Brepro 只为让**本步自身**的 Dev 产物
      #   可复现（否则 /Brepro 只在 Release 分支注入 -> PE TimeDateStamp /
      #   调试目录时间戳每次不同）。它与 reproducible job 的判定**无关**：
      #   那一侧两侧都是 Release（Release 隐含 /Brepro），见下方 5d 说明。
      #
      # ⚠️ 本步的 seeds.json **不会**被 reproducible job 复用（缺陷 5d）：
      #   门禁 `release_check.ps1:250` 的 `-Config Release -RecordSeeds` 覆盖了
      #   `build\demo.exe` 与 `build\seeds.json`，上传的是那份 Release 产物。
      - name: Build (Dev), record seeds
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -MachineId auto -RecordSeeds -SkipSign -Brepro

      - name: Run e2e suite (T1-T28)
        run: python tests\e2e.py

      - name: Run attack-simulation suite (A1-A12)
        run: python tests\attacks.py

      - name: Run VM unit tests
        run: .\build\vm_unit.exe

      - name: Run vmc compiler tests (M2/M3)
        run: python tests\vmc_tests.py

      - name: Run tool_demo example suite (E1-E7)
        run: |
          powershell -ExecutionPolicy Bypass -File examples\tool_demo\build_example.ps1
          python examples\tool_demo\test_example.py

      # CI_PLAN §2.2: 保护链静态断言 (P1-P6) — 防止保护能力静默失效
      - name: Protection chain static asserts (P1-P6)
        run: python tests\protchain_check.py

      # 阶段 1/3/5 新增的门禁项必须也在 CI 里跑 —— 否则等于"本地才生效的门禁",
      # 与 P3 教训相悖 (可绕过的门禁会掩盖缺陷)。release_check 覆盖 33 项 (默认 30)。
      - name: Module contract (modcheck)
        run: python tools\modcheck.py --all-compositions

      - name: Attack-drill records (drills lint)
        run: python tools\drills.py lint

      - name: Public-material drift (doccheck)
        run: python tools\doccheck.py

      # ============================================================
      # 新增门禁项（2026-09-23）
      #
      # **为什么必须在这里也跑**：项目纪律 ——
      #   "新增门禁项必须也在 CI 里跑，否则等于'本地才生效的门禁'，
      #    与 P3 教训相悖（可绕过的门禁会掩盖缺陷）"。
      # ============================================================

      # 协议兼容性（W6.2）: 含**负向自检**（自证能抓错）
      - name: Protocol conformance (含自检)
        run: |
          python tools\conformance.py --selftest
          python tools\conformance.py modules.json

      # 骨架回归（2026-09-23）: 验证 **DIY 用户路径**可用
      #
      # **为什么关键**: 曾发生阻断级缺陷 —— skeleton/strings.txt 未随
      # strcrypt.h 枚举同步 -> **所有 DIY 用户构建失败**，而门禁没抓到，
      # 因为"从不构建骨架"。本项覆盖该路径。
      - name: Skeleton regression (DIY 路径)
        run: python tools\skeleton_check.py

      # 检查器变异测试（W5.4）: 每个检查器须自证能抓错
      - name: Checker mutation test
        run: python tools\mutate_check.py

      # 迁移成本门禁（W5.7）: 防止 W1.6 成果回退
      - name: Migration cost gate
        run: python tools\migration_gate.py --quiet

      # 完整门禁（**阻塞式**）。CI 里跳过"工作区干净"检查 ——
      # 上游步骤已产生构建产物，该项在 CI 中恒失败。
      #
      # ## 项数口径（2026-10-02 更新，此前写的是过期的「其余 13 项」）
      #   静态 `Check` 调用点 **33** 个；默认运行 **30** 项（3 项 `-With*`
      #   门禁默认不跑，会打印 `[info] … 未运行 — 未验证 != 通过`）。
      #   运行期每项留下一枚证据行: `[ok]` / `[X]` / `[skip]` / `[info]`。
      #
      # ## 为什么允许 `[skip]` 而不是要求"30 项全绿"
      #   Windows runner 上**没有 WSL 发行版**，也**从不构建 linux/perf 产物**
      #   -> 4 项跨平台/产物依赖的检查（`linux_compile_check`、
      #   `check_state_platform`、`docclaim` 的 linux 断言、`perf_baseline`）
      #   的前置不满足。它们**必须**报 `[skip]`（退出码 2）而非 `[X]`:
      #   前置不存在时判据从未执行，"未运行"必须与"已通过"可区分
      #   （「未验证 != 通过」），但把"环境没装"报成 FAIL 则会让门禁
      #   在干净 runner 上**永远红** —— "永远红"的门禁与没有门禁等价。
      #   `[skip]` **不计入** `PASS:` 的分子，故不会被伪装成通过。
      #   Linux 覆盖由本 workflow 的 `linux-portability` job 真实验证。
      # 注意: **不要**用 continue-on-error —— 那会让门禁变成"可绕过的门禁",
      # 正是本项目 P3 教训所反对的（曾因此让 smoke 缺陷藏了一个月）。
      - name: Full release gate
        run: powershell -ExecutionPolicy Bypass -File tools\release_check.ps1 -SkipDirtyCheck

      - name: Python syntax check (all tools)
        run: powershell -Command "python -m py_compile tools\vmenc.py tools\strgen.py tools\hashpatch.py tools\indirect.py tools\selfcrypt_proto.py tools\vmc.py tools\vcvars.py tools\mock_server.py tools\modcheck.py tools\drills.py tools\doccheck.py tools\compose.py tools\ingest_attacks.py tests\e2e.py tests\attacks.py tests\vmc_tests.py tests\protchain_check.py examples\tool_demo\test_example.py"

      # ## 为什么必须单独上传门禁日志（2026-10-02 实测教训）
      #   `Full release gate` 失败时，上面的 artifact 上传步**根本不会执行**
      #   （GitHub Actions 默认 `if: success()`），而 `gate_log.ps1` 记录的
      #   完整转录只存在 runner 本地 -> **失败现场随 runner 一起销毁**。
      #   第四跑就吃了这个亏: 门禁报 `FAIL: 1/27`，被测的看起来是 e2e，
      #   但日志里拿不到那一行 —— 只能靠 12 行截断的诊断去猜。
      #   => `if: always()`，把 `build/logs/**` 无条件带出来。
      #   这不是"掩盖失败": 门禁仍然 FAIL 且 job 仍然红，只是**留下证据**。
      #   （与 `tools/gate_log.ps1` 文件头记名的「失败项名与详情永久丢失」
      #     同型事故的对策。日志是辅助证据, 不改变任何判据。）
      - name: Upload gate logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: build\logs\**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build\demo.exe
            build\vm_unit.exe
            build\vm.blob
            build\manifest.json
            build\seeds.json
            build\keys\license_priv.json
            demo\vm_build.json
          if-no-files-found: error
          retention-days: 7
          # 注: license_priv.json 是**测试用临时密钥**（每次构建由 keygen 生成,
          # 仅供 reproducible job 复现同一次构建), 不是正式签发私钥。
          # 正式签发私钥从不进入仓库或 CI（见 .gitignore 的 sdk_service/keys/）。

  # CI_PLAN §2.3: 可复现门禁 — 同种子两次构建字节一致
  reproducible:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Build Tools 2022 x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download seeds from build job
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build_artifacts

      # ## 缺陷 5d（2026-10-02 实测）: 必须 `-Config Release`，不能沿用默认 Dev
      #   本 job 下载的 `build\demo.exe` **不是** build-and-verify 步骤 1 的产物：
      #   门禁 `tools\release_check.ps1:250` 用 `-Config Release` 覆盖了它，
      #   紧跟的 `:253` `repro_check.ps1`（`:24`/`:34`，同样是 Release）又覆盖一次
      #   -- 上传的正是**门禁遗留的 Release 产物**，其 `build\seeds.json` 也是
      #   门禁那次 `-RecordSeeds` 写的。
      #   若这里用 Dev 重建，比对的是"同种子、不同配置"的两个二进制：
      #   实测差异 **276571 字节 / 14365 簇**（`build/_repro_5d_ci_out.txt`），
      #   恒 MISMATCH，与 `/Brepro` 无关。Release 隐含 `/Brepro`，故无需再传。
      #   （`docs/CI_PLAN.md:67` 原本就写的 `Build (Release, -SeedsFile …)`。）
      # ## 缺陷 7（2026-10-02 CI 第八跑实测）: 产物**保留目录结构**
      #   `actions/upload-artifact@v4` 取所有 path 的**最近公共祖先**作为根;
      #   本 job 上传的三个路径分别是 `build\...` 与 `demo\...`，
      #   公共祖先是**工作区根** -> 解压出来是
      #     build_artifacts\build\demo.exe
      #     build_artifacts\demo\vm_build.json
      #   而不是 `build_artifacts\demo.exe`。
      #   实测报错（CI 第八跑，本 job 第 5 步）:
      #     Copy-Item: Cannot find path
      #       'D:\a\shardvase\shardvase\build_artifacts\seeds.json' because it does not exist.
      #   ⚠️ 本 job 在此前**每一轮**都是 skipped（`needs: build-and-verify` 红），
      #      所以这个错**从未被执行过** —— 与缺陷 5 同型: "没跑过的代码 = 没验证"。
      #   下载后可实测确认结构（`gh run download <id> -n build-artifacts -D <dir>`）。
      - name: Reproducible rebuild (same seeds + key, no signing)
        run: |
          New-Item -ItemType Directory -Force -Path build\keys | Out-Null
          Copy-Item build_artifacts\build\seeds.json build\seeds.json
          Copy-Item build_artifacts\demo\vm_build.json demo\vm_build.json
          Copy-Item build_artifacts\build\keys\license_priv.json build\keys\license_priv.json
          powershell -ExecutionPolicy Bypass -File build.ps1 -Config Release -MachineId auto -SkipSign -SkipSmoke -SeedsFile build\seeds.json

      - name: Compare SHA-256 with first build
        shell: pwsh
        run: |
          $a = (Get-FileHash build_artifacts\build\demo.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash build\demo.exe -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Host "MISMATCH demo.exe`n  first=$a`n  second=$b"
            exit 1
          }
          $c = (Get-FileHash build_artifacts\build\vm.blob -Algorithm SHA256).Hash
          $d = (Get-FileHash build\vm.blob -Algorithm SHA256).Hash
          if ($c -ne $d) {
            Write-Host "MISMATCH vm.blob`n  first=$c`n  second=$d"
            exit 1
          }
          Write-Host "reproducible: demo.exe + vm.blob byte-identical"


  # ==============================================================
  # SDK 打包与发布（缺口 #4，2026-09-23）
  #
  # 两个触发条件:
  #   · push 到 main      -> 只**打包并上传 artifact**（验证打包可用）
  #   · 推送 v* tag       -> 额外**建 GitHub Release 并上传 zip**
  #
  # **为什么需要**: 此前发布需手工跑 `sdk_pack.py` 再手工上传。
  # 自动化后，"发布 SDK" = 推一个 tag。
  # ==============================================================
  sdk-package:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build-and-verify
    permissions:
      contents: write        # 建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Build Tools 2022 x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 打包器自检（含"包内 skeleton/strings.txt 与枚举一致"的防复发检查）
      - name: SDK packer selftest
        run: python tools\sdk_pack.py --selftest

      - name: Build SDK package
        run: python tools\sdk_pack.py --force --zip

      # **关键**: 验证包**独立可用**（脱离仓库能否构建）
      - name: Verify SDK is standalone
        run: python tools\verify_sdk_standalone.py

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shardvase-sdk
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # 仅 tag 推送时发布 Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.ref_name }}"
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Write-Host "publishing $ver -> $($zip.Name)"
          gh release create $ver $zip.FullName `
            --repo ${{ github.repository }} `
            --title "ShardVase SDK $ver" `
            --notes-file CHANGELOG.md `
            --verify-tag


  # ==============================================================
  # Linux 可移植性（L5c，2026-09-23）
  #
  # ## 为什么需要这个 job
  #   L4 建立了**平台层契约测试**（tests/platform_conformance.c）——
  #   它的设计目的正是: **任何平台实现，只要能通过该测试，即契约合规**。
  #
  #   本 job 在**真实 Linux** 上跑该测试 -> 让"Linux 支持"
  #   从**口号**变成 **CI 可见的状态**。
  #
  # ## 当前预期
  #   Linux 平台层**尚未实现** -> 编译会失败 -> **job 失败**。
  #   这是**刻意的**: 未实现的状态应**明确可见**，而非静默跳过。
  #
  #   实现后（src/platform/prot_platform_linux.c 就位）本 job 即转绿。
  #
  # ## 同时验证"纯逻辑模块真的可移植"
  #   这部分**现在就应该通过** —— 它验证 L2/L3 的解耦成果。
  # ==============================================================
  linux-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          gcc --version | head -1
          python3 --version

      # ---- 第一部分: 纯逻辑模块的**平台无关性**（现在就应通过）----
      #
      # 这些模块经 L2/L3 解耦后**不含平台 API** -> 在 Linux 上应能编译。
      # 若此步失败 -> 说明解耦不彻底（**真实回归**）。
      - name: Pure-logic modules compile on Linux
        run: |
          set -e
          mkdir -p /tmp/pl
          for f in crc32 vm_rekey strcrypt; do
            echo "=== src/$f.c ==="
            gcc -c -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE -I include \
                "src/$f.c" -o "/tmp/pl/$f.o"
          done
          echo "纯逻辑模块在 Linux 上编译通过"
          ls -la /tmp/pl/

      # ---- 第二部分: 平台层契约测试（Linux 实现就位后应通过）----
      #
      # 这是 L4-A 设计的**验收点**: 任何平台实现跑同一个测试。
      - name: Platform layer conformance (Linux)
        run: |
          set -e
          if [ ! -f src/platform/prot_platform_linux.c ]; then
            echo "::error::Linux 平台层尚未实现（src/platform/prot_platform_linux.c 缺失）"
            echo "契约测试是**验收条件**: 实现后本 job 应转绿。"
            echo "设计见 docs/PORTABILITY_ASSESSMENT.md §8"
            exit 1
          fi
          gcc -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE -I include \
              tests/platform_conformance.c \
              src/platform/prot_platform_linux.c \
              -o /tmp/platconf
          /tmp/platconf

      # ---- 第三部分: 注册表与契约在 Linux 上一致 ----
      #
      # 这些工具是**纯 Python**，应与平台无关。
      - name: Contract checks on Linux
        run: |
          set -e
          python3 tools/modcheck.py
          python3 tools/conformance.py modules.json
          python3 tools/attackcheck.py --quiet
